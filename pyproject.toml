[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpga-attention-tile-planner"
version = "0.2.0"
description = "Plan self-attention tile sizes for FPGA and accelerator SRAM budgets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jiakai03177-coder" }]
keywords = [
  "fpga",
  "attention",
  "transformer",
  "tiling",
  "hbm",
  "sram",
  "llm"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.scripts]
attention-tiles = "fpga_attention_tile_planner.cli:main"

[tool.setuptools.packages.find]
include = ["fpga_attention_tile_planner*"]

